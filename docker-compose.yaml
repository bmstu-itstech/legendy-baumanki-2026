services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: LEGENDY_BAUMANKI_2026
      DOMAIN: ${DOMAIN}
      SECRET_KEY: ${SECRET_KEY}
      DB_TYPE: ASYNC_POSTGRESQL
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      FILES_STORAGE_DIR: /app/storage/files
    volumes:
      - ${SECRETS_DIR:-./secrets}:/app/secrets:ro
      - backend_storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  # Загрузки пользователей и медиа заданий. Переживает пересборку и пересоздание
  # контейнера и `docker system prune`. Удалится только вместе с
  # `docker compose down -v` или `docker volume rm`.
  backend_storage:
